name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешения нужны самому Pages: записать артефакт и опубликовать его.
permissions:
  contents: read
  pages: write
  id-token: write

# Если пушей несколько подряд, доезжает последний, но текущий деплой не рвём.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        # BASE_PATH нужен, потому что сайт живёт по адресу user.github.io/balhash,
        # то есть в подпапке. Локально и на Vercel переменной нет и сайт в корне.
        env:
          BASE_PATH: /balhash
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
